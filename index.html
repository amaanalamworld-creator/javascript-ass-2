
<!DOCTYPE html>
<html>
<head>
    <title>Student Result</title>
</head>
<body>

<script>

    // Enter Subject Marks
    var english = Number(prompt("Enter English Marks"));
    var maths = Number(prompt("Enter Mathematics Marks"));
    var physics = Number(prompt("Enter Physics Marks"));
    var chemistry = Number(prompt("Enter Chemistry Marks"));
    var computer = Number(prompt("Enter Computer Science Marks"));

    // Calculate Total Marks
    var totalMarks = 500;

    var obtainedMarks = english + maths + physics + chemistry + computer;

    // Calculate Percentage
    var percentage = (obtainedMarks / totalMarks) * 100;

    // Calculate Grade
    var grade;

    if (percentage >= 90) {
        grade = "A";
    }
    else if (percentage >= 80) {
        grade = "B";
    }
    else if (percentage >= 70) {
        grade = "C";
    }
    else if (percentage >= 60) {
        grade = "D";
    }
    else if (percentage >= 50) {
        grade = "E";
    }
    else {
        grade = "Fail";
    }

    // Display Final Result
    alert(
        "Total Marks: " + totalMarks +
        "\nObtained Marks: " + obtainedMarks +
        "\nPercentage: " + percentage + "%" +
        "\nYour Grade: " + grade
    );

</script>

</body>
</html>
